services:
  - type: web
    name: pint-agents
    runtime: docker
    plan: free
    region: frankfurt  # or oregon, singapore - choose closest to your users
    rootDirectory: agents  # Build from the agents subdirectory
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    healthCheckPath: /health
    envVars:
      # Database
      - key: DATABASE_URL
        sync: false  # You'll set this in Render dashboard
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # API Keys
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: BRIGHTDATA_API_KEY
        sync: false

      # Brightdata URLs
      - key: BRIGHTDATA_STREAMABLE_HTTP_URL
        value: https://mcp.brightdata.com/mcp?token=
      - key: BRIGHTDATA_SSE_URL
        value: https://mcp.brightdata.com/sse?token=

      # LangSmith (optional)
      - key: LANGSMITH_TRACING
        value: true
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGCHAIN_PROJECT
        value: Pint

      # Production URL (update after Vercel deployment)
      - key: FRONTEND_URL
        sync: false  # You'll set this to your Vercel URL
